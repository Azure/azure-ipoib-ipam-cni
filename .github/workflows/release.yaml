name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-azure-ipoib-ipam-cni:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm
          - os: linux
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binary
        run: |
          rm -rf ./bin
          ARCH=${{ matrix.arch }} make build
          mv bin/azure-ipoib-ipam-cni bin/azure-ipoib-ipam-cni-${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-ipoib-ipam-cni-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/azure-ipoib-ipam-cni-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
  build-docker-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm
          push: true
          tags: ghcr.io/azure/azure-ipoib-ipam-cni:${{ github.ref_name }}
      - name: Build and push webhook Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.webhook
          platforms: linux/amd64,linux/arm64,linux/arm
          push: true
          tags: ghcr.io/azure/azure-ipoib-ipam-cni-webhook:${{ github.ref_name }}
  publish:
      runs-on: ubuntu-latest
      needs:
        - build-azure-ipoib-ipam-cni
      permissions:
        contents: write
        pull-requests: write
      steps:
        - name: Download artifacts
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
            path: ./artifacts
        - name: Publish release
          uses: softprops/action-gh-release@v3 # v1
          with:
            files: |
              ./artifacts/azure-ipoib-ipam-cni-*-*/*
